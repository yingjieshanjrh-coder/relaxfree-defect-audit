[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relaxfree"
version = "0.1.0"
description = "Cross-host audit of relaxation-free point-defect prescreening"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yingjie Shan", email = "yingjieshanjrh@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
